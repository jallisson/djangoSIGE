{%extends 'base/base.html'%}

{%block title%}{{titulo}}{%endblock%}
{% block has_shell %}false{% endblock %}

{% block app_body %}
<div id="popupform-container" class="sige-modern-form sige-popup-form" data-popup-title="{{titulo}}">
	<div class="sige-form-card sige-modal__panel">
		<div class="header sige-form-header">
			<h2><span>{{titulo}}</span><button type="button" class="close sige-modal__close sige-popup-close" data-dismiss="modal" aria-label="Fechar"><span aria-hidden="true">&times;</span></button></h2>
		</div>
		<form id="popupform" role="form" action="" method="post" class="sige-form">
			{% csrf_token %}
			<div class="body sige-form-body">
				<div class="sige-form-grid sige-form-grid--legacy">
				{% for field in form %}
				<div class="col-sm-12 sige-field {% if field.field.widget.input_type == 'textarea' %}sige-field--full{% endif %}">
					<div class="form-group">
						<label>{{field.label}}{% if field.field.required %}<strong style="color:red;"> *</strong>{% endif %}</label>
						{% if field.errors %}<label class="error">{% for error in field.errors %}{{error}}{% endfor %}</label>{% endif %}
						<div class="input-group">
							<div class="form-line">
			      				{{field}}
			      			</div>
		      			</div>
		      		</div>
		    	</div>
		    	{% endfor %}
		    	</div>
		    	<div class="sige-form-actions">
		    		<button type="button" class="btn sige-button sige-button--ghost sige-popup-cancel" data-dismiss="modal">Cancelar</button>
		    		<button class="btn btn-success foot-btn sige-button sige-button--primary" type="submit"><i class="material-icons">&#xE148;</i><span> SALVAR</span></button>
		    	</div>
	    	</div>
    	</form>
   	</div>
</div>
{%endblock%}

{% block js %}
<script>

	$.Admin.popupwindow.init();

</script>
{% endblock %}
