<div class="formset-box {% if tipo_pessoa == 'cliente' %}sige-formset-box sige-formset-box--compact{% endif %}">

	{% for form in formset %}
	<div id="{{formset.prefix}}-{{forloop.counter0}}" class="formset {% if tipo_pessoa == 'cliente' %}sige-formset sige-form-section sige-form-section--compact{% endif %}" style="border:none;margin-bottom:0px;padding-bottom:0px;">

	  <div class="{% if tipo_pessoa == 'cliente' %}sige-form-grid{% endif %}">
	  {% for field in form.visible_fields %}
	  <div class="col-sm-5 {% if tipo_pessoa == 'cliente' %}sige-field{% endif %}" style="float:left;">
	    <div class="form-group">
	      <div class="form-line">
	        <label>{% if field.label %}{{field.label}}<span class="formset-padrao"> (padrão)<i class="material-icons" title="As entradas padrão serão utilizadas no preenchimento de notas fiscais, pedidos de venda/compra, etc.">&#xE887;</i></span>{%else%}&nbsp;{%endif%}</label>
	        {% if field.errors %}<label class="error">{% for error in field.errors %}{{error}}{% endfor %}</label>{% endif %}
	        {{field}}
	      </div>
	    </div>
	  </div>
	  {% endfor %}
	  </div>
	  <a class="remove-formset" style="float:left;"></a>

	  {{ form.id }}

	  <div class="col-sm-12 {% if tipo_pessoa == 'cliente' %}sige-form-actions sige-form-actions--inline{% endif %}">
	    <a class="btn btn-xs add-formset {% if tipo_pessoa == 'cliente' %}sige-button sige-button--ghost{% endif %}">Adicionar novo</a>
	  </div>
	</div>

	{% endfor %}

	{{formset.management_form}}

</div>
