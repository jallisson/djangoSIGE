<div class="formset-box sige-formset-box">

	{% for form in formset %}
	<div id="{{formset.prefix}}-{{forloop.counter0}}" class="formset sige-formset sige-form-section sige-form-section--compact" style="border:none;margin-bottom:0px;padding-bottom:0px;">

	  <div class="sige-form-grid sige-form-grid--legacy">
	  {% for field in form.visible_fields %}
	  <div class="sige-field">
	    <div class="form-group">
	      <div class="form-line">
	        <label>{% if field.label %}{{field.label}}{%else%}&nbsp;{%endif%}</label>
	        {% if field.errors %}<label class="error">{% for error in field.errors %}{{error}}{% endfor %}</label>{% endif %}
	        {{field}}
	      </div>
	    </div>
	  </div>
	  {% endfor %}
	  </div>
	  <div class="sige-formset-box__header sige-formset-box__header--compact">
	    <a class="remove-formset"></a>
	  </div>

	  {{ form.id }}
	  {% for hidden in form.hidden_fields %}
	  	{{ hidden }}
	  {% endfor %}

	  <div class="sige-form-actions sige-form-actions--inline sige-formset-box__actions">
	    <a class="btn btn-xs add-formset sige-button sige-button--ghost">Adicionar novo</a>
	  </div>
	</div>

	{% endfor %}

	{{formset.management_form}}

</div>
