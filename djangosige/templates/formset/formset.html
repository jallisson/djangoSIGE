<div class="formset-box sige-formset-box">

  {% for form in formset %}
  <div id="{{formset.prefix}}-{{forloop.counter0}}" class="formset sige-formset sige-form-section">

    <div class="formset-header sige-section-header sige-section-header--inline sige-formset-box__header">
      <h4 class="formset-title">{{title}}<span class="formset-padrao"> (padrão)<i class="material-icons" title="As entradas padrão serão utilizadas no preenchimento de notas fiscais, pedidos de venda/compra, etc.">&#xE887;</i></span><a class="remove-formset"></a></h4>
    </div>

    <div class="sige-form-grid sige-form-grid--legacy">
    {% for field in form.visible_fields %}
    <div class="sige-field">
      <div class="form-group">
        <div class="form-line">
          <label>{{field.label}}</label>
          {% if field.errors %}<label class="error">{% for error in field.errors %}{{error}}{% endfor %}</label>{% endif %}
          {{field}}
        </div>
      </div>
    </div>
    {% endfor %}
    </div>

    {{ form.id }}

    <div class="sige-form-actions sige-form-actions--inline sige-formset-box__actions">
      <a class="btn btn-xs add-formset sige-button sige-button--ghost">Adicionar novo</a>
    </div>
  </div>

  {% endfor %}

  {{formset.management_form}}

</div>
